<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameDig</title>
<meta name="description" content="App Storeのゲームを掘り出せる検索ページ。新作も過去作も、説明文まで検索できます。">
<meta name="theme-color" content="#3b5bfd">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="GameDig">
<meta property="og:type" content="website">
<meta property="og:title" content="GameDig">
<meta property="og:description" content="App Storeのゲームを掘り出そう。新作も過去作も、説明文まで検索。">
<meta property="og:url" content="https://gamedig-app.github.io/GameDig/">
<meta property="og:image" content="https://gamedig-app.github.io/GameDig/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --bg:#f6f7fb; --fg:#1b1d29; --sub:#6b7085; --card:#fff; --accent:#3b5bfd; --line:#d8dbe8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12131a; --fg:#eceef7; --sub:#9a9fb5; --card:#1d1f2b; --accent:#7b93ff; --line:#33364a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font-family:-apple-system, "Hiragino Sans", sans-serif; }
  h1 { font-size:28px; font-weight:800; letter-spacing:-0.5px; margin:0; }
  h1 span { background:linear-gradient(90deg,#3b5bfd,#a855f7); -webkit-background-clip:text;
            background-clip:text; color:transparent; }
  .tag { color:var(--sub); font-size:13px; margin:2px 0 14px; }
  footer { color:var(--sub); font-size:12px; line-height:1.6; margin:24px 0 8px; text-align:center; }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  input, select, button { font-size:16px; padding:10px; border-radius:10px;
         border:1px solid var(--line); background:var(--card); color:var(--fg); }
  input[type=text], input[type=search] { flex:1; min-width:0; width:100%; }
  select { width:100%; }
  button { background:var(--accent); color:#fff; border:none; font-weight:600; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }

  #filters { background:var(--card); border-radius:14px; margin-bottom:8px; }
  #filters > summary { padding:12px; cursor:pointer; font-weight:600; list-style:none; }
  #filters > summary::-webkit-details-marker { display:none; }
  #filters > summary::after { content:"▾"; float:right; color:var(--sub); }
  #filters[open] > summary::after { content:"▴"; }
  #summary { display:block; font-weight:400; font-size:13px; color:var(--sub); margin-top:2px; }
  .panel { padding:0 12px 12px; border-top:1px solid var(--line); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
  .field label { display:block; font-size:13px; color:var(--sub); margin-bottom:4px; }
  .field.wide { grid-column:1 / -1; }
  .check { display:flex; align-items:center; gap:8px; font-size:16px; padding:10px 0; }
  .check input { width:20px; height:20px; }

  .bar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:12px 0 8px; }
  #status { color:var(--sub); font-size:14px; }
  .bar select { width:auto; padding:8px; font-size:14px; }

  .card { background:var(--card); border-radius:14px; padding:12px; margin-bottom:10px; }
  .item { display:flex; gap:12px; text-decoration:none; color:inherit; }
  .item img { width:64px; height:64px; border-radius:14px; flex:none; }
  [hidden] { display:none !important; }
  a.name { display:block; font-weight:600; font-size:15px; color:inherit; text-decoration:none; }
  .devlink { background:none; border:none; padding:0; margin:0; font-size:13px; font-weight:400;
             color:var(--accent); text-align:left; border-radius:0; }
  .devbar { display:flex; align-items:center; justify-content:space-between; gap:8px;
            background:var(--card); border-radius:14px; padding:10px 12px; margin-bottom:8px;
            font-size:13px; color:var(--sub); }
  .devbar button { flex:none; padding:8px 12px; font-size:14px; }
  .more { width:100%; margin:4px 0 12px; padding:14px; }
  .recent { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:-2px 0 10px; font-size:13px; color:var(--sub); }
  .chip { background:var(--card); color:var(--fg); border:1px solid var(--line); padding:6px 10px;
          border-radius:999px; font-size:13px; font-weight:400; }
  .linkbtn { background:none; border:none; color:var(--sub); font-size:12px; font-weight:400;
             padding:4px; text-decoration:underline; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--line);
          border-top-color:var(--accent); border-radius:50%; margin-right:8px; vertical-align:-2px;
          animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration:3s; } }
  .totop { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0px));
           width:44px; height:44px; padding:0; border-radius:50%; font-size:20px;
           box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .meta { color:var(--sub); font-size:13px; margin-top:2px; }
  .desc { margin-top:10px; }
  .desc summary { cursor:pointer; font-size:14px; color:var(--accent); padding:4px 0; }
  .desc-text { font-size:13px; line-height:1.6; white-space:pre-wrap; max-height:260px; overflow-y:auto;
               margin-top:6px; padding-top:8px; border-top:1px solid var(--line); }
  .shots { display:flex; gap:8px; overflow-x:auto; margin-top:10px; -webkit-overflow-scrolling:touch; }
  .shots img { height:180px; width:auto; border-radius:10px; flex:none; }
</style>
</head>
<body>
<h1>Game<span>Dig</span></h1>
<div class="tag">App Storeのゲームを掘り出そう</div>

<div class="row">
  <input type="text" id="kw" placeholder="キーワード（名前・説明文・開発者名）" aria-label="キーワード（スペース区切り）">
  <button id="go">検索</button>
</div>
<div id="recent" class="recent" hidden></div>

<details id="filters">
  <summary>絞り込み<span id="summary"></span></summary>
  <div class="panel">
    <div class="grid">
      <div class="field">
        <label for="genre">ジャンル</label>
        <select id="genre">
          <option value="">すべて</option>
          <option>ロールプレイング</option><option>パズル</option><option>アクション</option>
          <option>シミュレーション</option><option>ストラテジー</option><option>カジュアル</option>
          <option>レース</option><option>スポーツ</option><option>アドベンチャー</option>
          <option>カード</option><option>音楽</option>
        </select>
      </div>
      <div class="field">
        <label for="device">対応端末</label>
        <select id="device">
          <option value="">すべて</option>
          <option value="iphone" selected>iPhone対応</option>
          <option value="ipad">iPad対応</option>
        </select>
      </div>
      <div class="field">
        <label for="days">公開日（期間）</label>
        <select id="days">
          <option value="7">7日以内</option>
          <option value="30" selected>30日以内</option>
          <option value="90">90日以内</option>
          <option value="365">1年以内</option>
          <option value="0">すべての期間</option>
        </select>
      </div>
      <div class="field wide">
        <label for="match">キーワードが複数あるとき</label>
        <select id="match">
          <option value="any" selected>いずれかを含む（言い換え・表記ゆれ向き）</option>
          <option value="all">すべてを含む（絞り込み向き）</option>
        </select>
      </div>
      <div class="field">
        <label for="free">価格</label>
        <div class="check"><input type="checkbox" id="free"><span>無料のみ</span></div>
      </div>
    </div>
    <button type="button" class="ghost" id="reset">条件をリセット</button>
  </div>
</details>

<div class="bar">
  <div id="status">キーワードは空欄でもOK。「検索」を押すとゲーム全般から探します。</div>
  <select id="sort" aria-label="並び替え">
    <option value="date">公開が新しい順</option>
    <option value="updated">更新が新しい順</option>
    <option value="relevance">関連度順</option>
    <option value="rating">評価が高い順</option>
    <option value="count">評価数が多い順</option>
  </select>
</div>
<div id="devbar" class="devbar" hidden>
  <span>開発者のゲームを表示中（絞り込みは適用されません）</span>
  <button type="button" class="ghost" id="back">← 戻る</button>
</div>
<div id="list"></div>

<footer>GameDigはApple Inc.とは無関係の非公式サイトです。<br>App Store、iPhoneはApple Inc.の商標です。<br>データはiTunes Search APIから取得しています。</footer>

<button type="button" id="top" class="totop" hidden aria-label="一番上へ戻る">↑</button>

<script>
let pool = [];
let searchWords = [];  // 最後に「検索」したときのキーワード（空欄なら絞り込まない）  // 検索で取得したゲーム全部。絞り込み・並び替えはここから即時に再表示する
const $ = id => document.getElementById(id);

// iTunes Search API を JSONP（scriptタグ方式）で呼び出す
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error("error")); };
    s.src = url + "&callback=" + cb;
    document.body.appendChild(s);
  });
}

function esc(t) {
  return String(t).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function formatSize(bytes) {
  const n = Number(bytes);
  if (!n) return "";
  return n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : Math.round(n / 1e6) + " MB";
}

// 今の絞り込み条件を、閉じたままでも分かるように1行で見せる
function updateSummary() {
  const parts = [];
  if ($("genre").value) parts.push($("genre").value);
  if ($("device").value) parts.push($("device").selectedOptions[0].text);
  parts.push($("days").selectedOptions[0].text);
  if ($("free").checked) parts.push("無料のみ");
  if (searchWords.length > 1) parts.push($("match").value === "all" ? "すべて含む" : "いずれか含む");
  $("summary").textContent = parts.join(" ・ ");
}

const PAGE = 50;       // 一度に表示する件数
let shown = PAGE;
let devMode = null;    // 開発者の一覧を見ているとき {name}
let saved = null;      // 開発者の一覧に入る前の状態（戻るボタン用）

function sortApps(apps) {
  const sort = $("sort").value;
  const t = d => new Date(d).getTime() || 0;
  if (sort === "rating") apps.sort((a, b) => (b.averageUserRating || 0) - (a.averageUserRating || 0));
  else if (sort === "count") apps.sort((a, b) => (b.userRatingCount || 0) - (a.userRatingCount || 0));
  else if (sort === "relevance") apps.sort((a, b) => a._i - b._i);
  else if (sort === "updated") apps.sort((a, b) => t(b.currentVersionReleaseDate || b.releaseDate) - t(a.currentVersionReleaseDate || a.releaseDate));
  else apps.sort((a, b) => t(b.releaseDate) - t(a.releaseDate));
  return apps;
}

function filtered() {
  if (devMode) return sortApps(pool.slice());  // 開発者の一覧は、絞り込みをかけず全部出す
  const genre = $("genre").value, device = $("device").value;
  const freeOnly = $("free").checked;
  const words = searchWords.map(w => w.toLowerCase());
  const matchAll = $("match").value === "all";
  const daysNum = Number($("days").value);
  const since = daysNum ? Date.now() - daysNum * 86400000 : 0;

  const apps = pool.filter(a => {
    const devs = a.supportedDevices || [];
    const genreOk = !genre || (a.genres || []).includes(genre);
    const deviceOk = !device ||
      (device === "iphone" && ((a.screenshotUrls || []).length > 0 || devs.some(d => d.includes("iPhone")))) ||
      (device === "ipad" && ((a.ipadScreenshotUrls || []).length > 0 || devs.some(d => d.includes("iPad"))));
    const priceOk = !freeOnly || a.price === 0;
    const hay = ((a.trackName || "") + " " + (a.description || "") + " " + (a.artistName || "")).toLowerCase();
    const textOk = !words.length || (matchAll ? words.every(w => hay.includes(w)) : words.some(w => hay.includes(w)));
    return genreOk && deviceOk && priceOk && textOk && new Date(a.releaseDate).getTime() >= since;
  });
  return sortApps(apps);
}

function card(a) {
  const shots = (a.screenshotUrls && a.screenshotUrls.length ? a.screenshotUrls : a.ipadScreenshotUrls || []).slice(0, 5);
  const rating = a.userRatingCount ? "★" + a.averageUserRating.toFixed(1) + "（" + a.userRatingCount + "件）" : "評価なし";
  const size = formatSize(a.fileSizeBytes);
  const upd = (a.currentVersionReleaseDate || "").slice(0, 10);
  const dev = a.artistId
    ? `<button type="button" class="devlink" data-id="${esc(a.artistId)}" data-name="${esc(a.artistName || "")}">${esc(a.artistName || "")}</button>`
    : esc(a.artistName || "");
  return `
    <div class="card">
      <div class="item">
        <a href="${esc(a.trackViewUrl)}" target="_blank" rel="noopener"><img src="${esc(a.artworkUrl100)}" alt=""></a>
        <div>
          <a class="name" href="${esc(a.trackViewUrl)}" target="_blank" rel="noopener">${esc(a.trackName)}</a>
          <div class="meta">${dev}</div>
          ${$("sort").value === "updated" && upd ? `<div class="meta">更新 ${esc(upd)}</div>` : ""}
          <div class="meta">公開日 ${esc(a.releaseDate.slice(0, 10))} ／ ${esc(rating)}</div>
          <div class="meta">${esc(a.primaryGenreName)} ／ ${a.formattedPrice ? esc(a.formattedPrice) : ""}${size ? " ／ " + esc(size) : ""}</div>
        </div>
      </div>
      ${a.description ? `<details class="desc"><summary>説明を見る</summary><div class="desc-text">${esc(a.description)}</div></details>` : ""}
      ${shots.length ? `<div class="shots">${shots.map(u => `<img src="${esc(u)}" alt="" loading="lazy">`).join("")}</div>` : ""}
    </div>`;
}

// 件数の表示と「もっと見る」ボタンを今の状態に合わせる
function updateMore(total) {
  const visible = Math.min(shown, total);
  const prefix = devMode ? "「" + devMode.name + "」のゲーム " : "";
  $("status").textContent = prefix + (total > visible ? total + "件中 " + visible + "件を表示" : total + "件");
  const btn = $("more");
  if (total > visible) {
    if (!btn) $("list").insertAdjacentHTML("beforeend", '<button type="button" class="more" id="more"></button>');
    $("more").textContent = "もっと見る（残り" + (total - visible) + "件）";
  } else if (btn) {
    btn.remove();
  }
}

function render(keepShown) {
  if (!keepShown) shown = PAGE;
  updateSummary();
  updateUrl();
  $("devbar").hidden = !devMode;
  if (!pool.length) return;  // まだ検索していない、または0件のときは、検索側のメッセージを残す
  const apps = filtered();

  if (!apps.length) {
    $("status").textContent = "条件に合うゲームがありません。絞り込みを緩めてみてください。";
    $("list").innerHTML = "";
    return;
  }
  $("list").innerHTML = apps.slice(0, shown).map(card).join("");
  updateMore(apps.length);
}

// 「もっと見る」: 開いている説明文などを閉じないよう、続きだけを足す
function showMore() {
  const apps = filtered();
  const from = shown;
  shown += PAGE;
  $("more").insertAdjacentHTML("beforebegin", apps.slice(from, shown).map(card).join(""));
  updateMore(apps.length);
}

// 開発者の名前をタップしたとき、その開発者のゲームを全部出す
async function showDeveloper(id, name) {
  const before = devMode ? saved : { pool, searchWords };
  loading("「" + name + "」のゲームを読み込み中…");
  try {
    const r = await jsonp("https://itunes.apple.com/lookup?country=jp&entity=software&limit=200&id=" + encodeURIComponent(id));
    const list = (r.results || []).filter(a => a.trackId != null && (a.genres || []).some(g => g === "ゲーム" || g === "Games"));
    list.forEach((a, i) => { a._i = i; });
    if (!list.length) { $("status").textContent = "「" + name + "」のゲームが見つかりませんでした。"; return; }
    saved = before;
    devMode = { name };
    pool = list;
    searchWords = [];
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) {
    $("status").textContent = "取得できませんでした。通信状況を確認して、もう一度試してください。";
  }
}

function backFromDeveloper() {
  if (!saved) return;
  pool = saved.pool;
  searchWords = saved.searchWords;
  devMode = null;
  saved = null;
  render();
}

// ---- 読み込み中の表示 ----
function loading(msg) { $("status").innerHTML = '<span class="spin"></span>' + esc(msg); }

// ---- 検索条件をURLに保存（ブックマークやホーム画面追加で、同じ検索を開ける） ----
let searched = false;   // 一度でも検索したか
let lastQuery = "";     // 最後に検索したキーワード
function updateUrl() {
  if (!searched || devMode) return;
  const p = new URLSearchParams();
  p.set("go", "1");
  if (lastQuery) p.set("q", lastQuery);
  if ($("genre").value) p.set("genre", $("genre").value);
  if ($("device").value !== "iphone") p.set("device", $("device").value);
  if ($("days").value !== "30") p.set("days", $("days").value);
  if ($("free").checked) p.set("free", "1");
  if ($("match").value !== "any") p.set("match", $("match").value);
  if ($("sort").value !== "date") p.set("sort", $("sort").value);
  try { history.replaceState(null, "", "?" + p.toString()); } catch (e) {}
}
function setSelect(id, v) {
  if (v !== null && v !== undefined && [...$(id).options].some(o => o.value === v)) $(id).value = v;
}
function applyUrl() {
  const p = new URLSearchParams(location.search);
  if (p.get("go") !== "1") return false;
  $("kw").value = p.get("q") || "";
  setSelect("genre", p.get("genre"));
  setSelect("device", p.has("device") ? p.get("device") : "iphone");
  setSelect("days", p.get("days") || "30");
  $("free").checked = p.get("free") === "1";
  setSelect("match", p.get("match") || "any");
  setSelect("sort", p.get("sort") || "date");
  return true;
}

// ---- 最近の検索（このスマホのブラウザにだけ保存） ----
const RECENT_KEY = "gamedig.recent";
function loadRecent() {
  try {
    const v = JSON.parse(localStorage.getItem(RECENT_KEY));
    return Array.isArray(v) ? v.filter(x => typeof x === "string") : [];
  } catch (e) { return []; }
}
function saveRecent(q) {
  if (!q) return;
  const list = [q, ...loadRecent().filter(x => x !== q)].slice(0, 5);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch (e) {}
}
function renderRecent() {
  const list = loadRecent();
  $("recent").hidden = !list.length;
  $("recent").innerHTML = list.length
    ? "最近：" + list.map(q => `<button type="button" class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")
      + '<button type="button" class="linkbtn" id="clear-recent">履歴を消す</button>'
    : "";
}

async function search() {
  const DEFAULT_WORDS = ["ゲーム","RPG","パズル","アクション","放置","カジュアル","シミュレーション","育成","バトル","ストラテジー","アドベンチャー","レース","スポーツ","カード","脱出","ローグライク","タワーディフェンス","ミニゲーム"];
  const typed = $("kw").value.trim().split(/\s+/).filter(Boolean);
  const words = typed.length ? typed : DEFAULT_WORDS;
  searchWords = typed;
  lastQuery = typed.join(" ");
  searched = true;
  saveRecent(lastQuery);
  renderRecent();
  $("go").disabled = true;
  devMode = null;
  saved = null;
  $("devbar").hidden = true;

  loading("検索中…");
  $("list").innerHTML = "";
  pool = [];

  try {
    const results = await Promise.all(words.map(w =>
      jsonp("https://itunes.apple.com/search?country=jp&entity=software&limit=200&term=" + encodeURIComponent(w))
    ));
    // 重複を除き、ゲームだけを残す（そのほかの絞り込みは render() で行う）
    const seen = new Map();
    for (const r of results) {
      for (const a of r.results || []) {
        if ((a.genres || []).some(g => g === "ゲーム" || g === "Games") && !seen.has(a.trackId)) { a._i = seen.size; seen.set(a.trackId, a); }
      }
    }
    pool = [...seen.values()];
    if (!pool.length) { $("status").textContent = "見つかりませんでした。別のキーワードを試してください。"; return; }
    render();
  } catch (e) {
    $("status").textContent = "取得できませんでした。通信状況を確認して、もう一度試してください。";
  } finally {
    $("go").disabled = false;
  }
}

function resetFilters() {
  $("genre").value = "";
  $("device").value = "iphone";
  $("days").value = "30";
  $("free").checked = false;
  $("match").value = "any";
  render();
}

$("go").addEventListener("click", search);
$("kw").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
["genre", "device", "days", "free", "sort", "match"].forEach(id => $(id).addEventListener("change", () => render()));
$("back").addEventListener("click", backFromDeveloper);
$("list").addEventListener("click", e => {
  const dev = e.target.closest(".devlink");
  if (dev) { showDeveloper(dev.dataset.id, dev.dataset.name); return; }
  if (e.target.closest("#more")) showMore();
});
$("reset").addEventListener("click", resetFilters);
$("recent").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip) { $("kw").value = chip.dataset.q; search(); return; }
  if (e.target.closest("#clear-recent")) {
    try { localStorage.removeItem(RECENT_KEY); } catch (err) {}
    renderRecent();
  }
});
const topBtn = $("top");
window.addEventListener("scroll", () => { topBtn.hidden = window.scrollY < 600; }, { passive: true });
topBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
updateSummary();
renderRecent();
if (applyUrl()) { updateSummary(); search(); }
</script>
</body>
</html>
