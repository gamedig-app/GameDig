<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新着ゲームさがし</title>
<style>
  :root { --bg:#f6f7fb; --fg:#1b1d29; --sub:#6b7085; --card:#fff; --accent:#3b5bfd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12131a; --fg:#eceef7; --sub:#9a9fb5; --card:#1d1f2b; --accent:#7b93ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font-family:-apple-system, "Hiragino Sans", sans-serif; }
  h1 { font-size:20px; margin:0 0 12px; }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  input, select, button { font-size:16px; padding:10px; border-radius:10px;
         border:1px solid var(--sub); background:var(--card); color:var(--fg); }
  input { flex:1; min-width:0; }
  button { background:var(--accent); color:#fff; border:none; font-weight:600; }
  #status { color:var(--sub); font-size:14px; margin:8px 0; min-height:20px; }
  .item { display:flex; gap:12px; background:var(--card); border-radius:14px;
          padding:12px; margin-bottom:10px; text-decoration:none; color:inherit; }
  .item img { width:64px; height:64px; border-radius:14px; flex:none; }
  .name { font-weight:600; font-size:15px; }
  .meta { color:var(--sub); font-size:13px; margin-top:2px; }
</style>
</head>
<body>
<h1>新着ゲームさがし</h1>

<div class="row">
  <input id="kw" value="RPG パズル アクション" aria-label="キーワード（スペース区切り）">
  <button id="go">検索</button>
</div>
<div class="row">
  <select id="days" aria-label="期間">
    <option value="7">7日以内</option>
    <option value="30" selected>30日以内</option>
    <option value="90">90日以内</option>
  </select>
</div>
<div id="status">キーワードはスペースで区切ると、まとめて検索します。</div>
<div id="list"></div>

<script>
// iTunes Search API を JSONP（scriptタグ方式）で呼び出す
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error("error")); };
    s.src = url + "&callback=" + cb;
    document.body.appendChild(s);
  });
}

function esc(t) {
  return String(t).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

async function search() {
  const words = document.getElementById("kw").value.trim().split(/\s+/).filter(Boolean);
  const days = Number(document.getElementById("days").value);
  const status = document.getElementById("status");
  const list = document.getElementById("list");
  if (!words.length) { status.textContent = "キーワードを入力してください。"; return; }

  status.textContent = "検索中…";
  list.innerHTML = "";

  try {
    const results = await Promise.all(words.map(w =>
      jsonp("https://itunes.apple.com/search?country=jp&entity=software&limit=200&term=" + encodeURIComponent(w))
    ));

    // 重複を除き、ゲームだけ、期間内だけに絞る
    const seen = new Map();
    const since = Date.now() - days * 86400000;
    for (const r of results) {
      for (const a of r.results || []) {
        const isGame = (a.genres || []).some(g => g === "ゲーム" || g === "Games");
        if (isGame && new Date(a.releaseDate).getTime() >= since) seen.set(a.trackId, a);
      }
    }

    // 公開日が新しい順
    const apps = [...seen.values()].sort((a, b) => new Date(b.releaseDate) - new Date(a.releaseDate));

    if (!apps.length) { status.textContent = "見つかりませんでした。期間を広げるか、別のキーワードを試してください。"; return; }
    status.textContent = apps.length + "件見つかりました（公開日が新しい順）";
    list.innerHTML = apps.map(a => `
      <a class="item" href="${esc(a.trackViewUrl)}" target="_blank" rel="noopener">
        <img src="${esc(a.artworkUrl100)}" alt="">
        <div>
          <div class="name">${esc(a.trackName)}</div>
          <div class="meta">公開日 ${esc(a.releaseDate.slice(0, 10))}</div>
          <div class="meta">${esc(a.primaryGenreName)} ／ ${a.formattedPrice ? esc(a.formattedPrice) : ""}</div>
        </div>
      </a>`).join("");
  } catch (e) {
    status.textContent = "取得できませんでした。通信状況を確認して、もう一度試してください。";
  }
}

document.getElementById("go").addEventListener("click", search);
document.getElementById("kw").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
