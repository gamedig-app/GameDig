<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameDig</title>
<meta name="description" content="App Storeのゲームを掘り出せる検索ページ。新作も過去作も、説明文まで検索できます。">
<meta name="theme-color" content="#3b5bfd">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="GameDig">
<meta property="og:type" content="website">
<meta property="og:title" content="GameDig">
<meta property="og:description" content="App Storeのゲームを掘り出そう。新作も過去作も、説明文まで検索。">
<meta property="og:url" content="https://iranaimeru.github.io/GameDig/">
<meta property="og:image" content="https://iranaimeru.github.io/GameDig/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --bg:#f6f7fb; --fg:#1b1d29; --sub:#6b7085; --card:#fff; --accent:#3b5bfd; --line:#d8dbe8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12131a; --fg:#eceef7; --sub:#9a9fb5; --card:#1d1f2b; --accent:#7b93ff; --line:#33364a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font-family:-apple-system, "Hiragino Sans", sans-serif; }
  h1 { font-size:28px; font-weight:800; letter-spacing:-0.5px; margin:0; }
  h1 span { background:linear-gradient(90deg,#3b5bfd,#a855f7); -webkit-background-clip:text;
            background-clip:text; color:transparent; }
  .tag { color:var(--sub); font-size:13px; margin:2px 0 14px; }
  footer { color:var(--sub); font-size:12px; line-height:1.6; margin:24px 0 8px; text-align:center; }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  input, select, button { font-size:16px; padding:10px; border-radius:10px;
         border:1px solid var(--line); background:var(--card); color:var(--fg); }
  input[type=text], input[type=search] { flex:1; min-width:0; width:100%; }
  select { width:100%; }
  button { background:var(--accent); color:#fff; border:none; font-weight:600; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }

  #filters { background:var(--card); border-radius:14px; margin-bottom:8px; }
  #filters > summary { padding:12px; cursor:pointer; font-weight:600; list-style:none; }
  #filters > summary::-webkit-details-marker { display:none; }
  #filters > summary::after { content:"▾"; float:right; color:var(--sub); }
  #filters[open] > summary::after { content:"▴"; }
  #summary { display:block; font-weight:400; font-size:13px; color:var(--sub); margin-top:2px; }
  .panel { padding:0 12px 12px; border-top:1px solid var(--line); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
  .field label { display:block; font-size:13px; color:var(--sub); margin-bottom:4px; }
  .field.wide { grid-column:1 / -1; }
  .check { display:flex; align-items:center; gap:8px; font-size:16px; padding:10px 0; }
  .check input { width:20px; height:20px; }

  .bar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:12px 0 8px; }
  #status { color:var(--sub); font-size:14px; }
  .bar select { width:auto; padding:8px; font-size:14px; }

  .card { background:var(--card); border-radius:14px; padding:12px; margin-bottom:10px; }
  .item { display:flex; gap:12px; text-decoration:none; color:inherit; }
  .item img { width:64px; height:64px; border-radius:14px; flex:none; }
  .name { font-weight:600; font-size:15px; }
  .meta { color:var(--sub); font-size:13px; margin-top:2px; }
  .desc { margin-top:10px; }
  .desc summary { cursor:pointer; font-size:14px; color:var(--accent); padding:4px 0; }
  .desc-text { font-size:13px; line-height:1.6; white-space:pre-wrap; max-height:260px; overflow-y:auto;
               margin-top:6px; padding-top:8px; border-top:1px solid var(--line); }
  .shots { display:flex; gap:8px; overflow-x:auto; margin-top:10px; -webkit-overflow-scrolling:touch; }
  .shots img { height:180px; width:auto; border-radius:10px; flex:none; }
</style>
</head>
<body>
<h1>Game<span>Dig</span></h1>
<div class="tag">App Storeのゲームを掘り出そう</div>

<div class="row">
  <input type="text" id="kw" placeholder="キーワード（名前・説明文・開発者名）" aria-label="キーワード（スペース区切り）">
  <button id="go">検索</button>
</div>

<details id="filters">
  <summary>絞り込み<span id="summary"></span></summary>
  <div class="panel">
    <div class="grid">
      <div class="field">
        <label for="genre">ジャンル</label>
        <select id="genre">
          <option value="">すべて</option>
          <option>ロールプレイング</option><option>パズル</option><option>アクション</option>
          <option>シミュレーション</option><option>ストラテジー</option><option>カジュアル</option>
          <option>レース</option><option>スポーツ</option><option>アドベンチャー</option>
          <option>カード</option><option>音楽</option>
        </select>
      </div>
      <div class="field">
        <label for="device">対応端末</label>
        <select id="device">
          <option value="">すべて</option>
          <option value="iphone" selected>iPhone対応</option>
          <option value="ipad">iPad対応</option>
        </select>
      </div>
      <div class="field">
        <label for="days">公開日（期間）</label>
        <select id="days">
          <option value="7">7日以内</option>
          <option value="30" selected>30日以内</option>
          <option value="90">90日以内</option>
          <option value="365">1年以内</option>
          <option value="0">すべての期間</option>
        </select>
      </div>
      <div class="field wide">
        <label for="match">キーワードが複数あるとき</label>
        <select id="match">
          <option value="any" selected>いずれかを含む（言い換え・表記ゆれ向き）</option>
          <option value="all">すべてを含む（絞り込み向き）</option>
        </select>
      </div>
      <div class="field">
        <label for="free">価格</label>
        <div class="check"><input type="checkbox" id="free"><span>無料のみ</span></div>
      </div>
    </div>
    <button type="button" class="ghost" id="reset">条件をリセット</button>
  </div>
</details>

<div class="bar">
  <div id="status">キーワードは空欄でもOK。「検索」を押すとゲーム全般から探します。</div>
  <select id="sort" aria-label="並び替え">
    <option value="date">新しい順</option>
    <option value="relevance">関連度順</option>
    <option value="rating">評価が高い順</option>
    <option value="count">評価数が多い順</option>
  </select>
</div>
<div id="list"></div>

<footer>GameDigはApple Inc.とは無関係の非公式サイトです。<br>App Store、iPhoneはApple Inc.の商標です。<br>データはiTunes Search APIから取得しています。</footer>

<script>
let pool = [];
let searchWords = [];  // 最後に「検索」したときのキーワード（空欄なら絞り込まない）  // 検索で取得したゲーム全部。絞り込み・並び替えはここから即時に再表示する
const $ = id => document.getElementById(id);

// iTunes Search API を JSONP（scriptタグ方式）で呼び出す
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error("error")); };
    s.src = url + "&callback=" + cb;
    document.body.appendChild(s);
  });
}

function esc(t) {
  return String(t).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function formatSize(bytes) {
  const n = Number(bytes);
  if (!n) return "";
  return n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : Math.round(n / 1e6) + " MB";
}

// 今の絞り込み条件を、閉じたままでも分かるように1行で見せる
function updateSummary() {
  const parts = [];
  if ($("genre").value) parts.push($("genre").value);
  if ($("device").value) parts.push($("device").selectedOptions[0].text);
  parts.push($("days").selectedOptions[0].text);
  if ($("free").checked) parts.push("無料のみ");
  if (searchWords.length > 1) parts.push($("match").value === "all" ? "すべて含む" : "いずれか含む");
  $("summary").textContent = parts.join(" ・ ");
}

function filtered() {
  const genre = $("genre").value, device = $("device").value;
  const freeOnly = $("free").checked;
  const words = searchWords.map(w => w.toLowerCase());
  const matchAll = $("match").value === "all";
  const daysNum = Number($("days").value);
  const since = daysNum ? Date.now() - daysNum * 86400000 : 0;
  const sort = $("sort").value;

  const apps = pool.filter(a => {
    const devs = a.supportedDevices || [];
    const genreOk = !genre || (a.genres || []).includes(genre);
    const deviceOk = !device ||
      (device === "iphone" && ((a.screenshotUrls || []).length > 0 || devs.some(d => d.includes("iPhone")))) ||
      (device === "ipad" && ((a.ipadScreenshotUrls || []).length > 0 || devs.some(d => d.includes("iPad"))));
    const priceOk = !freeOnly || a.price === 0;
    const hay = ((a.trackName || "") + " " + (a.description || "") + " " + (a.artistName || "")).toLowerCase();
    const textOk = !words.length || (matchAll ? words.every(w => hay.includes(w)) : words.some(w => hay.includes(w)));
    return genreOk && deviceOk && priceOk && textOk && new Date(a.releaseDate).getTime() >= since;
  });

  if (sort === "rating") apps.sort((a, b) => (b.averageUserRating || 0) - (a.averageUserRating || 0));
  else if (sort === "count") apps.sort((a, b) => (b.userRatingCount || 0) - (a.userRatingCount || 0));
  else if (sort === "relevance") apps.sort((a, b) => a._i - b._i);
  else apps.sort((a, b) => new Date(b.releaseDate) - new Date(a.releaseDate));
  return apps;
}

function render() {
  updateSummary();
  if (!pool.length) return;  // まだ検索していない、または0件のときは、検索側のメッセージを残す
  const apps = filtered();

  if (!apps.length) {
    $("status").textContent = "条件に合うゲームがありません。絞り込みを緩めてみてください。";
    $("list").innerHTML = "";
    return;
  }
  $("status").textContent = apps.length + "件";

  $("list").innerHTML = apps.map(a => {
    const shots = (a.screenshotUrls && a.screenshotUrls.length ? a.screenshotUrls : a.ipadScreenshotUrls || []).slice(0, 5);
    const rating = a.userRatingCount ? "★" + a.averageUserRating.toFixed(1) + "（" + a.userRatingCount + "件）" : "評価なし";
    const size = formatSize(a.fileSizeBytes);
    return `
      <div class="card">
        <a class="item" href="${esc(a.trackViewUrl)}" target="_blank" rel="noopener">
          <img src="${esc(a.artworkUrl100)}" alt="">
          <div>
            <div class="name">${esc(a.trackName)}</div>
            <div class="meta">${esc(a.artistName || "")}</div>
            <div class="meta">公開日 ${esc(a.releaseDate.slice(0, 10))} ／ ${esc(rating)}</div>
            <div class="meta">${esc(a.primaryGenreName)} ／ ${a.formattedPrice ? esc(a.formattedPrice) : ""}${size ? " ／ " + esc(size) : ""}</div>
          </div>
        </a>
        ${a.description ? `<details class="desc"><summary>説明を見る</summary><div class="desc-text">${esc(a.description)}</div></details>` : ""}
        ${shots.length ? `<div class="shots">${shots.map(u => `<img src="${esc(u)}" alt="" loading="lazy">`).join("")}</div>` : ""}
      </div>`;
  }).join("");
}

async function search() {
  const DEFAULT_WORDS = ["ゲーム","RPG","パズル","アクション","放置","カジュアル","シミュレーション","育成","バトル","ストラテジー","アドベンチャー","レース","スポーツ","カード","脱出","ローグライク","タワーディフェンス","ミニゲーム"];
  const typed = $("kw").value.trim().split(/\s+/).filter(Boolean);
  const words = typed.length ? typed : DEFAULT_WORDS;
  searchWords = typed;

  $("status").textContent = "検索中…";
  $("list").innerHTML = "";
  pool = [];

  try {
    const results = await Promise.all(words.map(w =>
      jsonp("https://itunes.apple.com/search?country=jp&entity=software&limit=200&term=" + encodeURIComponent(w))
    ));
    // 重複を除き、ゲームだけを残す（そのほかの絞り込みは render() で行う）
    const seen = new Map();
    for (const r of results) {
      for (const a of r.results || []) {
        if ((a.genres || []).some(g => g === "ゲーム" || g === "Games") && !seen.has(a.trackId)) { a._i = seen.size; seen.set(a.trackId, a); }
      }
    }
    pool = [...seen.values()];
    if (!pool.length) { $("status").textContent = "見つかりませんでした。別のキーワードを試してください。"; return; }
    render();
  } catch (e) {
    $("status").textContent = "取得できませんでした。通信状況を確認して、もう一度試してください。";
  }
}

function resetFilters() {
  $("genre").value = "";
  $("device").value = "iphone";
  $("days").value = "30";
  $("free").checked = false;
  $("match").value = "any";
  render();
}

$("go").addEventListener("click", search);
$("kw").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
["genre", "device", "days", "free", "sort", "match"].forEach(id => $(id).addEventListener("change", render));
$("reset").addEventListener("click", resetFilters);
updateSummary();
</script>
</body>
</html>
